<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>ARGOS</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#e9f1f6;font-family:'IBM Plex Sans',sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit;font:inherit}.top{height:88px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #20272a;position:relative;background:#000}.logo{background:none;border:0;font:700 31px 'IBM Plex Mono',monospace;letter-spacing:.25em;padding:10px}.logo span{display:block;font-size:8px;letter-spacing:.5em;color:#8cbcd5;margin-top:3px}.logo span:before,.logo span:after{content:'';display:inline-block;width:20px;height:1px;vertical-align:middle;background:#ff875f;margin:0 9px}.current{position:absolute;right:30px;color:#8cbcd5;font-size:11px}.home{max-width:1120px;margin:auto;padding:60px 25px 130px}.hero{text-align:center;padding:10px 0 42px}.hero h1{font:700 clamp(52px,8vw,94px) 'IBM Plex Mono',monospace;letter-spacing:.18em;margin:0 0 15px}.hero p{font:11px 'IBM Plex Mono',monospace;letter-spacing:.3em;color:#8cbcd5;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.module{background:#101314;border:1px solid #2b3439;border-radius:9px;text-align:left;padding:22px;min-height:130px;transition:.25s}.module:hover{border-color:#ff875f;transform:translateY(-4px)}.module b{display:block;font-size:18px;font-weight:600;margin:8px 0;color:#f1f6fb}.module small{color:#8fb0c1;font-size:12px}.module i{font:600 11px 'IBM Plex Mono',monospace;color:#ff875f;font-style:normal}.secondary{margin-top:24px;padding-top:24px;border-top:1px solid #2b3439;display:grid;grid-template-columns:1fr 1fr;gap:14px}.secondary .module{min-height:100px}.screen{display:none;height:calc(100dvh - 88px);padding-bottom:74px}.screen iframe{border:0;width:100%;height:100%;background:#000}.dock{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);max-width:calc(100% - 20px);display:flex;gap:4px;background:#101314ed;border:1px solid #344048;border-radius:13px;padding:6px;z-index:100;overflow:auto;backdrop-filter:blur(14px)}.dock button{border:0;background:transparent;color:#90b4c8;border-radius:8px;padding:11px 15px;white-space:nowrap;font-size:12px}.dock button.on{background:#303b43;color:white;box-shadow:inset 0 -2px #ff875f}.tools{max-width:950px;margin:auto;padding:25px 25px 120px}.tools h2{font-size:25px}.tools p{color:#92aebb}.tools a{color:#9ac8e1}.tools .module{display:block;width:100%;margin:12px 0;text-decoration:none}.anim{animation:up .4s ease both}@keyframes up{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@media(max-width:700px){.home{padding-top:35px}.grid{grid-template-columns:1fr 1fr;gap:10px}.module{padding:16px;min-height:135px}.module b{font-size:16px}.hero{padding-bottom:30px}.hero p{font-size:8px;letter-spacing:.15em}.secondary{grid-template-columns:1fr}.current{display:none}.dock{width:calc(100% - 16px);bottom:8px}.dock button{padding:12px 10px;font-size:11px}.top{height:78px}.screen{height:calc(100dvh - 78px)}}
</style><header class="top"><button class="logo" onclick="go('inicio')" aria-label="Voltar ao início">ARGOS<span>MANUTENÇÃO</span></button><span class="current" id="current"></span></header><main><section class="home" id="inicio"><div class="hero"><p>MANUTENÇÃO · VEGETAÇÃO · PLANEJAMENTO</p></div><div class="grid" id="modules"></div><div class="secondary"><button class="module" onclick="go('scripts')"><i>07 / FERRAMENTAS</i><b>Scripts e atualização de dados</b><small>Enviar bases, acompanhar processamento e baixar scripts</small></button><button class="module" onclick="go('relatorio')"><i>08 / DOCUMENTAÇÃO</i><b>Relatórios e apresentação</b><small>Validação dos trechos e apresentação do ARGOS</small></button></div></section><section class="screen" id="screen"><iframe id="frame" title="Módulo ARGOS" allow="fullscreen; clipboard-write"></iframe></section><section class="tools" id="scripts" hidden><h2>Scripts e atualização de dados</h2><button class="module" onclick="openUpdate()"><b>Atualizar bases</b><small>Abrir envio de arquivos e acompanhamento da rotina de atualização</small></button><a class="module" href="teste/assets/scripts/trechos-kml.zip" download><b>Script KML → trechos</b><small>Baixar pacote ZIP</small></a><a class="module" href="https://github.com/LGRSV/Skills/tree/main/ferramentas" target="_blank" rel="noopener"><b>Scripts de processamento</b><small>Ferramentas completas no repositório</small></a><a class="module" href="https://github.com/LGRSV/Skills/actions" target="_blank" rel="noopener"><b>Histórico de atualizações</b><small>Execuções e registros do processamento de bases</small></a></section></main><nav class="dock" id="dock" aria-label="Módulos"></nav><script>
const modules=[['mapa','Mapa da rede','Municípios, alimentadores e ativos','teste/index.html'],['painel','Painel gerencial','Metas e realizado por regional e polo','teste/painel/'],['priorizacao','Priorizador','Criticidade dos trechos e ranking','teste/priorizacao/'],['carteira','Carteira de faixa','Contratos, medições e serviços','teste/carteira/'],['podas','Mapa de podas','Quadras, perímetro urbano e situação da poda','teste/podas/'],['apresentacao','Apresentação','Visão geral do ARGOS','teste/apresentacao/'],['relatorio','Relatório de validação','Trechos, NAE e avisos por município','teste/relatorio.html']];
let active='inicio',last=0,pendingUpdate=false;const frame=document.getElementById('frame');const order=['inicio','mapa','painel','priorizacao','carteira','podas','scripts'];
document.getElementById('modules').innerHTML=modules.slice(0,6).map((m,i)=>`<button class="module" onclick="go('${m[0]}')"><i>0${i+1} / ARGOS</i><b>${m[1]}</b><small>${m[2]}</small></button>`).join('');document.getElementById('dock').innerHTML=[['inicio','Início'],['painel','Painel'],['priorizacao','Priorizador'],['carteira','Faixa'],['podas','Podas'],['scripts','Scripts']].map(m=>`<button data-page="${m[0]}" onclick="go('${m[0]}')">${m[1]}</button>`).join('');
function go(id){active=id;document.getElementById('inicio').style.display=id==='inicio'?'block':'none';document.getElementById('scripts').hidden=id!=='scripts';const m=modules.find(m=>m[0]===id);document.getElementById('screen').style.display=m?'block':'none';if(m&&frame.dataset.page!==id){frame.src=m[3];frame.dataset.page=id;}document.getElementById('current').textContent=m?m[1]:'';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===id));const el=id==='inicio'?document.getElementById('inicio'):id==='scripts'?document.getElementById('scripts'):document.getElementById('screen');el.classList.remove('anim');void el.offsetWidth;el.classList.add('anim');window.scrollTo(0,0);history.replaceState(null,'','#'+id)}
function step(d){if(Date.now()-last<1100)return;const i=order.indexOf(active);if(i<0||i+d<0||i+d>=order.length)return;last=Date.now();go(order[i+d])}
function bindScroll(w){let sum=0,start=0;const edge=d=>{const el=w.document.scrollingElement;return d>0?el.scrollTop+w.innerHeight>=el.scrollHeight-8:el.scrollTop<=0};w.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<Math.abs(e.deltaX))return;const d=Math.sign(e.deltaY);if(!edge(d)){sum=0;return;}sum+=e.deltaY;if(Math.abs(sum)>150){sum=0;step(d)}},{passive:true});w.addEventListener('touchstart',e=>start=e.touches[0].clientY,{passive:true});w.addEventListener('touchend',e=>{const d=start-e.changedTouches[0].clientY;if(Math.abs(d)>95&&edge(Math.sign(d)))step(Math.sign(d))},{passive:true})}
frame.addEventListener('load',()=>{try{bindScroll(frame.contentWindow);const h=frame.contentDocument.querySelector('.cab h1');if(h){h.style.cursor='pointer';h.onclick=()=>go('inicio')}if(pendingUpdate){pendingUpdate=false;frame.contentDocument.querySelector('.mnu-lista button[aria-haspopup="dialog"]')?.click()}}catch(e){}});function openUpdate(){pendingUpdate=true;frame.dataset.page='';go('mapa')}bindScroll(window);go(location.hash.slice(1)||'inicio');
</script></html>
