id-template-columns:1fr 1fr;gap:14px}.secondary .module{min-height:100px}.screen{display:none;height:calc(100dvh - 88px);padding-bottom:74px}.screen iframe{border:0;width:100%;height:100%;background:#000}.dock{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);max-width:calc(100% - 20px);display:flex;gap:4px;background:#101314ed;border:1px solid #344048;border-radius:13px;padding:6px;z-index:100;overflow:auto;backdrop-filter:blur(14px)}.dock button{border:0;background:transparent;color:#90b4c8;border-radius:8px;padding:11px 15px;white-space:nowrap;font-size:12px}.dock button.on{background:#303b43;color:white;box-shadow:inset 0 -2px #ff875f}.tools{max-width:950px;margin:auto;padding:25px 25px 120px}.tools h2{font-size:25px}.tools p{color:#92aebb}.tools a{color:#9ac8e1}.tools .module{display:block;width:100%;margin:12px 0;text-decoration:none}.anim{animation:up .4s ease both}@keyframes up{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@media(max-width:700px){.home{padding-top:35px}.grid{grid-template-columns:1fr 1fr;gap:10px}.module{padding:16px;min-height:135px}.module b{font-size:16px}.hero{padding-bottom:30px}.hero p{font-size:8px;letter-spacing:.15em}.secondary{grid-template-columns:1fr}.current{display:none}.dock{width:calc(100% - 16px);bottom:8px}.dock button{padding:12px 10px;font-size:11px}.top{height:78px}.screen{height:calc(100dvh - 78px)}}
.module-icon{display:block;width:31px;height:31px;fill:none;stroke:#ff875f;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;margin-bottom:13px;transition:transform .25s,stroke .25s}.module:hover .module-icon{transform:translateY(-2px);stroke:#ff9c79}.module-icon *{fill:none}@media(max-width:700px){.module-icon{width:28px;height:28px;margin-bottom:10px}}</style><header class="top"><button class="logo" onclick="go('inicio')" aria-label="Voltar ao início">ARGOS<span>MANUTENÇÃO</span></button><span class="current" id="current"></span></header><main><section class="home" id="inicio"><div class="hero"><p>MANUTENÇÃO · VEGETAÇÃO · PLANEJAMENTO</p></div><div class="grid" id="modules"></div><div class="secondary"><button class="module" onclick="go('scripts')"><svg class="module-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m6 9 3 3-3 3m7 0h5"/></svg><b>Scripts e atualização de dados</b><small>Enviar bases, acompanhar processamento e baixar scripts</small></button><button class="module" onclick="go('relatorio')"><svg class="module-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3h8l4 4v14H6ZM14 3v5h4M9 12h6M9 16h6"/></svg><b>Relatórios e apresentação</b><small>Validação dos trechos e apresentação do ARGOS</small></button></div></section><section class="screen" id="screen"><iframe id="frame" title="Módulo ARGOS" allow="fullscreen; clipboard-write"></iframe></section><section class="tools" id="scripts" hidden><h2>Scripts e atualização de dados</h2><button class="module" onclick="openUpdate()"><b>Atualizar bases</b><small>Abrir envio de arquivos e acompanhamento da rotina de atualização</small></button><a class="module" href="teste/assets/scripts/trechos-kml.zip" download><b>Script KML → trechos</b><small>Baixar pacote ZIP</small></a><a class="module" href="https://github.com/LGRSV/Skills/tree/main/ferramentas" target="_blank" rel="noopener"><b>Scripts de processamento</b><small>Ferramentas completas no repositório</small></a><a class="module" href="https://github.com/LGRSV/Skills/actions" target="_blank" rel="noopener"><b>Histórico de atualizações</b><small>Execuções e registros do processamento de bases</small></a></section></main><nav class="dock" id="dock" aria-label="Módulos"></nav><script>
const moduleIcons={"mapa": "<path d=\"m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Z\"/><path d=\"M9 3v16M15 5v16\"/><circle cx=\"15\" cy=\"10\" r=\"2.4\"/>", "painel": "<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M3 9h18M9 9v12M13 17v-3M17 17v-5\"/>", "priorizacao": "<path d=\"M8 5h13M8 12h10M8 19h7M3 3v4M1 5h4\"/><circle cx=\"3\" cy=\"12\" r=\"1\"/><circle cx=\"3\" cy=\"19\" r=\"1\"/>", "carteira": "<path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z\"/><path d=\"M8 17l2-5 2 5M9 15h2M16 11v7\"/>", "podas": "<path d=\"M12 21v-8m0 4 4-4M12 13C5 14 3 7 5 3c6-1 13 1 12 7-1 4-5 3-5 3ZM8 7l4 6M17 17l4-4m-3-1 4 4\"/>", "apresentacao": "<path d=\"M3 3h18M5 3v13h14V3M12 16v4m-4 2 4-2 4 2\"/><path d=\"m10 7 5 3-5 3Z\"/>", "scripts": "<rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"3\"/><path d=\"m6 9 3 3-3 3m7 0h5\"/>", "relatorio": "<path d=\"M6 3h8l4 4v14H6ZM14 3v5h4M9 12h6M9 16h6\"/>"};
function moduleIcon(id){return `<svg class="module-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${moduleIcons[id]||moduleIcons.painel}</svg>`;}
const modules=[['mapa','Mapa da rede','Municípios, alimentadores e ativos','teste/index.html'],['painel','Painel gerencial','Metas e realizado por regional e polo','teste/painel/'],['priorizacao','Priorizador','Criticidade dos trechos e ranking','teste/priorizacao/'],['carteira','Carteira de faixa','Contratos, medições e serviços','teste/carteira/'],['podas','Mapa de podas','Quadras, perímetro urbano e situação da poda','teste/podas/'],['apresentacao','Apresentação','Visão geral do ARGOS','teste/apresentacao/'],['relatorio','Relatório de validação','Trechos, NAE e avisos por município','teste/relatorio.html']];
let active='inicio',last=0,pendingUpdate=false;const frame=document.getElementById('frame');const order=['inicio','mapa','painel','priorizacao','carteira','podas','scripts'];
document.getElementById('modules').innerHTML=modules.slice(0,6).map((m,i)=>`<button class="module" onclick="go('${m[0]}')">${moduleIcon(m[0])}<b>${m[1]}</b><small>${m[2]}</small></button>`).join('');document.getElementById('dock').innerHTML=[['inicio','Início'],['painel','Painel'],['priorizacao','Priorizador'],['carteira','Faixa'],['podas','Podas'],['scripts','Scripts']].map(m=>`<button data-page="${m[0]}" onclick="go('${m[0]}')">${m[1]}</button>`).join('');
function go(id){active=id;document.getElementById('inicio').style.display=id==='inicio'?'block':'none';document.getElementById('scripts').hidden=id!=='scripts';const m=modules.find(m=>m[0]===id);document.getElementById('screen').style.display=m?'block':'none';if(m&&frame.dataset.page!==id){frame.src=m[3];frame.dataset.page=id;}document.getElementById('current').textContent=m?m[1]:'';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===id));const el=id==='inicio'?document.getElementById('inicio'):id==='scripts'?document.getElementById('scripts'):document.getElementById('screen');el.classList.remove('anim');void el.offsetWidth;el.classList.add('anim');window.scrollTo(0,0);history.replaceState(null,'','#'+id)}
function step(d){if(Date.now()-last<1100)return;const i=order.indexOf(active);if(i<0||i+d<0||i+d>=order.length)return;last=Date.now();go(order[i+d])}
function bindScroll(w){let sum=0,start=0;const edge=d=>{const el=w.document.scrollingElement;return d>0?el.scrollTop+w.innerHeight>=el.scrollHeight-8:el.scrollTop<=0};w.addEventListener('wheel',e=>{if(e.target.closest?.('.leaflet-container,.mt-mapa,dialog'))return;if(Math.abs(e.deltaY)<Math.abs(e.deltaX))return;const d=Math.sign(e.deltaY);if(!edge(d)){sum=0;return;}sum+=e.deltaY;if(Math.abs(sum)>150){sum=0;step(d)}},{passive:true});w.addEventListener('touchstart',e=>start=e.touches[0].clientY,{passive:true});w.addEventListener('touchend',e=>{const d=start-e.changedTouches[0].clientY;if(Math.abs(d)>95&&edge(Math.sign(d)))step(Math.sign(d))},{passive:true})}
frame.addEventListener('load',()=>{try{bindScroll(frame.contentWindow);const h=frame.contentDocument.querySelector('.cab h1');if(h){h.style.display='none'}if(pendingUpdate){pendingUpdate=false;frame.contentDocument.querySelector('.mnu-lista button[aria-haspopup="dialog"]')?.click()}}catch(e){}});function openUpdate(){pendingUpdate=true;frame.dataset.page='';go('mapa')}bindScroll(window);go(location.hash.slice(1)||'inicio');
</script></html>
